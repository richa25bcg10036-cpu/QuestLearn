<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuestLearn Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="dashboard-container">

    <h1 align="center">🌸 QuestLearn Dashboard</h1>

    <div class="player-card">

        <h2>Welcome, <span id="playerName">Player</span> 👋</h2>

        <br>

        <p><strong>⭐ XP:</strong> <span id="xp">0</span></p>

        <p><strong>🪙 Coins:</strong> <span id="coins">0</span></p>

        <p><strong>❤️ Lives:</strong> <span id="lives">3</span></p>

        <p><strong>🎮 Current Level:</strong> <span id="level">1</span></p>

    </div>

    <div class="card">

        <h2>📈 Progress</h2>

        <div class="progress">

            <div class="progress-fill" id="progressBar">

                0%

            </div>

        </div>

    </div>

    <div class="card">

        <h2>🏅 Badges</h2>

        <div class="badge-grid">

            <div class="badge" id="scienceBadge">

                🌳 Science Explorer

            </div>

            <div class="badge" id="mathBadge">

                ⛰️ Math Genius

            </div>

            <div class="badge" id="codingBadge">

                💻 Coding Hero

            </div>

            <div class="badge" id="historyBadge">

                🏰 History Master

            </div>

        </div>

    </div>

    <div class="card">

        <h2>🎮 Learning Worlds</h2>

        <br>

        <button class="levelBtn" id="level1Btn">

            🌳 Science Forest

        </button>

        <br><br>

        <button class="levelBtn" id="level2Btn">

            ⛰️ Mathematics Mountain

        </button>

        <br><br>

        <button class="levelBtn" id="level3Btn">

            💻 Coding City

        </button>

        <br><br>

        <button class="levelBtn" id="level4Btn">

            🏰 History Castle

        </button>

        <br><br>

        <button class="levelBtn" id="bossBtn">

            👑 Final Boss

        </button>

    </div>

</div>

<script src="../js/dashboard.js"></script>

</body>

</html>
