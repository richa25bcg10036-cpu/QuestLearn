<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coding City</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="quiz-box">

        <h1>💻 Coding City</h1>

        <p>Complete all 10 coding questions to unlock History Castle!</p>

        <br>

        <div id="quiz">

            <h2 class="question" id="question">
                Loading Question...
            </h2>

            <div id="answers">

                <button class="option"></button>

                <button class="option"></button>

                <button class="option"></button>

                <button class="option"></button>

            </div>

            <br>

            <p>
                Question
                <span id="currentQuestion">1</span>
                of
                <span id="totalQuestions">10</span>
            </p>

            <br>

            <p>
                Score:
                <span id="score">0</span>
            </p>

            <br>

            <button id="nextBtn">
                Next Question →
            </button>

        </div>

    </div>

    <script src="../js/level3.js"></script>

</body>

</html>
